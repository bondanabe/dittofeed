
x-database-credentials: &database-credentials
  DATABASE_USER: ${DATABASE_USER:-postgres}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set_DATABASE_PASSWORD_in_Coolify}

x-clickhouse-credentials: &clickhouse-credentials
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dittofeed}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set_CLICKHOUSE_PASSWORD_in_Coolify}

x-backend-app-env: &backend-app-env
  <<: [*database-credentials, *clickhouse-credentials]
  NODE_ENV: production
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  CLICKHOUSE_HOST: http://clickhouse-server:8123
  TEMPORAL_ADDRESS: temporal:7233
  WORKSPACE_NAME: ${WORKSPACE_NAME:-Default}
  AUTH_MODE: single-tenant
  SECRET_KEY: ${SECRET_KEY:?Set_SECRET_KEY_in_Coolify}
  PASSWORD: ${PASSWORD:?Set_PASSWORD_in_Coolify}
  DASHBOARD_URL: ${DASHBOARD_URL:?Set_DASHBOARD_URL_in_Coolify}
  DASHBOARD_API_BASE: ${DASHBOARD_API_BASE:?Set_DASHBOARD_API_BASE_in_Coolify}

services:
  lite:
    image: dittofeed/dittofeed-lite:v0.23.0
    restart: unless-stopped
    command: node --max-old-space-size=${LITE_MEM_LIMIT:-824} ./packages/lite/dist/scripts/startLite.js --workspace-name=${WORKSPACE_NAME:-Default}
    environment:
      <<: *backend-app-env
      BOOTSTRAP: "${BOOTSTRAP:-true}"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      clickhouse-server:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set_DATABASE_PASSWORD_in_Coolify}
      POSTGRES_DB: dittofeed
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse-server:
    image: clickhouse/clickhouse-server:24.12.6.70-alpine
    restart: unless-stopped
    environment:
      <<: *clickhouse-credentials
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    deploy:
      resources:
        limits:
          memory: 2048M

  temporal:
    image: temporalio/auto-setup:1.22.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PWD: ${DATABASE_PASSWORD:?Set_DATABASE_PASSWORD_in_Coolify}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/prod.yaml
    volumes:
      - ./packages/backend-lib/temporal-dynamicconfig:/etc/temporal/config/dynamicconfig:ro

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
